{% extends 'base.html' %}
{% block title %}Edit File{% endblock %}
{% block content %}
<h1>Edit File</h1>
<form method="post" class="form">
    <label for="filename">File Name</label>
    <input type="text" id="filename" name="filename" value="{{ file['original_filename'] }}" required>

    <label for="category">Category</label>
    <select id="category" name="category">
        {% for c in categories %}
        <option value="{{ c }}" {% if c == file['category'] %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
    </select>

    <button type="submit" class="btn">Save Changes</button>
</form>
<p class="hint">The file extension can't be changed -- the name must still end in .{{ file['original_filename'].rsplit('.', 1)[-1] }}.</p>
<p><a href="{{ url_for('my_files') }}">Back to My Files</a></p>
{% endblock %}
